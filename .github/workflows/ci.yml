name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:workspace
      - run: corepack pnpm format:check:workspace
      - run: corepack pnpm lint:workspace
      - run: corepack pnpm typecheck:workspace
      - run: corepack pnpm test:workspace
      - run: corepack pnpm audit --audit-level high
      - run: docker compose config --quiet

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: observatory
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatory -d observatory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://observatory:observatory@localhost:5432/observatory
      TEST_DATABASE_URL: postgresql://observatory:observatory@localhost:5432/observatory
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:workspace
      - run: corepack pnpm db:migrate
      - run: corepack pnpm test:workspace
      - run: corepack pnpm db:verify-read-role

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build:workspace
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
